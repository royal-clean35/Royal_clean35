<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin – Royal Clean 35</title>
<style>
:root{--bg:#f5f8fb;--card:#fff;--text:#0f1b2d;--muted:#5b6b80;--accent:#0a84ff;--line:#e1e8f0;--red:#d93025;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--text:#eaf1fb;--muted:#9fb0c6;--line:#22304a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:6px 0 12px}
input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button{background:var(--accent);color:#fff;border:0;font-weight:600;cursor:pointer}button.red{background:var(--red)}button.gray{background:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.muted{color:var(--muted);font-size:.9rem}.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}
img{max-width:100%;border-radius:10px;margin-top:8px;max-height:260px;object-fit:cover}
a{color:var(--accent)}#login{display:grid;gap:10px;max-width:340px;margin:60px auto}
.tag{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--line)}
</style></head><body><main>
<div id="login"><h1>Admin Royal Clean 35</h1>
<input id="em" type="email" placeholder="E-mail" autocomplete="username">
<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
<button id="in">Se connecter</button><div id="err" class="muted"></div></div>
<div id="app" hidden>
<h1>Réservations</h1>
<div class="bar"><select id="flt"><option value="">Tous les statuts</option><option>en attente</option><option>confirmée</option><option>terminée</option><option>annulée</option></select>
<button id="rf">Actualiser</button><button id="out" class="gray">Déconnexion</button></div>
<div id="cnt" class="muted"></div><div id="list"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL="COLLE_TON_URL_ICI", SUPABASE_KEY="COLLE_TA_CLE_ANON_ICI";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var $=function(i){return document.getElementById(i)};
var ST=["en attente","confirmée","terminée","annulée"];
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
async function show(){
  var s=await sb.auth.getSession();var ok=!!s.data.session;
  $("login").hidden=ok;$("app").hidden=!ok;if(ok)load();
}
async function load(){
  var q=sb.from("reservations").select("*").order("date",{ascending:true});
  if($("flt").value)q=q.eq("statut",$("flt").value);
  var r=await q;if(r.error){$("list").textContent="Erreur : "+r.error.message;return}
  $("cnt").textContent=r.data.length+" réservation(s)";
  $("list").innerHTML=r.data.map(function(x){
    return '<div class="card"><div class="top"><span>'+esc(x.nom)+'</span><span class="tag">'+esc(x.statut)+'</span></div>'
    +'<div class="muted">'+esc(x.date)+' · '+esc(x.creneau)+'</div>'
    +'<div>'+esc(x.formule)+' ('+esc(x.etat)+')</div>'
    +'<div><a href="tel:'+esc(x.tel)+'">'+esc(x.tel)+'</a></div>'
    +(x.message?'<div class="muted">'+esc(x.message)+'</div>':'')
    +(x.photo_url?'<a href="'+esc(x.photo_url)+'" target="_blank" rel="noopener"><img src="'+esc(x.photo_url)+'" alt="Photo du véhicule"></a>':'')
    +'<div class="row"><select data-id="'+x.id+'" class="st">'+ST.map(function(s){return '<option'+(s===x.statut?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'
    +'<button class="red del" data-id="'+x.id+'" data-p="'+esc(x.photo_url||"")+'">Supprimer</button></div></div>';
  }).join("")||'<p class="muted">Aucune réservation.</p>';
}
$("list").addEventListener("change",async function(e){
  if(!e.target.classList.contains("st"))return;
  var r=await sb.from("reservations").update({statut:e.target.value}).eq("id",e.target.dataset.id);
  if(r.error)alert(r.error.message);load();
});
$("list").addEventListener("click",async function(e){
  if(!e.target.classList.contains("del"))return;
  if(!confirm("Supprimer cette réservation ?"))return;
  var p=e.target.dataset.p;
  if(p){var n=p.split("/photos/")[1];if(n)await sb.storage.from("photos").remove([n])}
  var r=await sb.from("reservations").delete().eq("id",e.target.dataset.id);
  if(r.error)alert(r.error.message);load();
});
$("in").onclick=async function(){
  var r=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(r.error)$("err").textContent="Identifiants incorrects.";else show();
};
$("out").onclick=async function(){await sb.auth.signOut();show()};
$("rf").onclick=load;$("flt").onchange=load;
show();
</script></body></html>
